version: 2

updates:
  # npm workspaces (root + packages/* + apps/web + examples/*) — Dependabot
  # reads the root package.json's `workspaces` field and package-lock.json
  # automatically; a single root entry covers the whole monorepo.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # React 19.3+ is blocked by @react-three/fiber's peer range (>=19 <19.3);
    # holding the whole React quartet together until Fiber ships a 19.3-compatible
    # release. Recheck: npm view @react-three/fiber@latest peerDependencies.react
    ignore:
      - dependency-name: "react"
        versions: [">=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3.0"]
      # @changesets/cli v3 is a currency-only major, coupled to changesets/action v2
      # (v2 renames release.yml's inputs, and CI never exercises release.yml). Migrate
      # the CLI and the action together in one PR verified by a real release run.
      # Ignoring the major stops the weekly re-raise; remove this entry to do that
      # coupled migration. v2.x minor/patch still flows through.
      - dependency-name: "@changesets/cli"
        versions: [">=3.0.0"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Major version bumps are left ungrouped (one PR each) since they can
    # carry breaking changes that need individual review.

  # Keep pinned Action versions (actions/checkout, setup-node, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
